<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregunta Especial 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body, html {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Poppins','Segoe UI',sans-serif;
  overflow-x:hidden;
  scroll-behavior: smooth;
  background: linear-gradient(135deg,#22113a,#3d1a5e);
  position: relative;
  animation: bgAnim 12s ease infinite alternate;
}

@keyframes bgAnim {
  0% { background: linear-gradient(135deg,#22113a,#3d1a5e); }
  50% { background: linear-gradient(135deg,#2d1650,#491f80); }
  100% { background: linear-gradient(135deg,#1c1031,#3a1868); }
}

#container {
  position: relative;
  width: 100%;
  height: 100%;
}

/* --- Cursor en forma de corazon --- */
* {
  cursor: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%23ff6ba9'%20stroke='%23ffffff'%20stroke-width='0.8'%20d='M12%2021.35l-1.45-1.32C5.4%2015.36%202%2012.28%202%208.5%202%205.42%204.42%203%207.5%203c1.74%200%203.41.81%204.5%202.09C13.09%203.81%2014.76%203%2016.5%203%2019.58%203%2022%205.42%2022%208.5c0%203.78-3.4%206.86-8.55%2011.54L12%2021.35z'/%3E%3C/svg%3E") 14 20, auto !important;
}

/* --- Corazones del cursor --- */
.cursor-heart {
  position: fixed;
  z-index: 999;
  color: #ff6ba9;
  pointer-events:none;
  user-select:none;
  animation: heartBurst 1.1s ease-out forwards;
}
@keyframes heartBurst {
  0%   { transform: translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1; }
  55%  { transform: translate(-50%,-170%) scale(1.2) rotate(15deg); opacity:1; }
  100% { transform: translate(-50%,-290%) scale(0.9) rotate(-12deg); opacity:0; }
}

/* Contenedor de la pregunta */
.pregunta-container {
  position: absolute;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width:600px;
  text-align:center;
  padding: 40px;
  z-index:1;
}

/* Título con animación de latido */
.pregunta-container h2 {
  font-family:'Great Vibes','Playfair Display',serif;
  font-size: 46px;
  color: #fff;
  text-shadow: 0 0 25px rgba(255,107,169,0.5), 2px 2px 10px rgba(0,0,0,0.4);
  margin-bottom:30px;
  animation: heartbeat 1.5s infinite;
}
@keyframes heartbeat{
  0%,100%{transform: scale(1);}
  50%{transform: scale(1.1);}
}

/* Botones */
button {
  padding: 15px 35px;
  font-size: 20px;
  color:white;
  background:linear-gradient(135deg,#ff6ba9,#ff2e78);
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin: 10px;
  box-shadow: 0 5px 18px rgba(255,107,169,0.4);
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
}
button:hover{
  transform: scale(1.08);
  background:#e5508f;
  box-shadow: 0 8px 25px rgba(255,107,169,0.55);
}

/* Mensaje mostrado al hacer clic en Sí */
#mensaje{
  margin-top:20px;
  font-size:30px;
  color:#ffd166;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
}

/* Estrellas */
.star {
  position: fixed;
  width: 3px;
  height: 3px;
  background:#fff;
  border-radius:50%;
  pointer-events:none;
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity:0.15; transform: scale(0.8); }
  50% { opacity:0.9; transform: scale(1.2); }
}

/* Canvas confetti */
#confettiCanvas {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:998;
}

/* Responsive */
@media (max-width: 600px) {
  .pregunta-container { padding: 30px 15px; }
  .pregunta-container h2 { font-size: 30px; }
  button { padding: 14px 26px; font-size: 17px; }
  #mensaje { font-size: 24px; }
}
</style>
</head>
<body>
<div id="container">
  <canvas id="confettiCanvas"></canvas>

  <div class="pregunta-container">
    <h2>💌 Me quieres? 💌</h2>
    <button id="siBtn">Sí 😍</button>
    <button id="noBtn">No 😅</button>
    <p id="mensaje"></p>
  </div>
</div>

<script>
/* --- Corazones al mover el mouse --- */
let lastHeart = 0;
document.addEventListener('mousemove', function(e){
  const now = Date.now();
  if(now - lastHeart < 60) return;
  lastHeart = now;
  const heart = document.createElement('div');
  heart.classList.add('cursor-heart');
  heart.innerHTML = '❤';
  heart.style.left = e.clientX + 'px';
  heart.style.top = e.clientY + 'px';
  heart.style.fontSize = Math.random()*14+12 + 'px';
  document.body.appendChild(heart);
  setTimeout(()=> heart.remove(), 1100);
});

/* --- Estrellas --- */
function createStars(){
  for(let i=0;i<70;i++){
    const s=document.createElement("div");
    s.classList.add("star");
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDuration=(Math.random()*3+2)+"s";
    s.style.animationDelay=(Math.random()*3)+"s";
    document.body.appendChild(s);
  }
}
createStars();

/* --- Botón NO seguro --- */
const noBtn = document.getElementById('noBtn');
const container = document.getElementById('container');

noBtn.addEventListener('click', ()=>{
  const padding = 20; 
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;

  const maxTop = containerHeight - btnHeight - padding;
  const maxLeft = containerWidth - btnWidth - padding;

  const top = Math.random() * (maxTop * 0.6) + padding;
  const left = Math.random() * (maxLeft * 0.6) + padding;

  noBtn.style.position = 'absolute';
  noBtn.style.top = `${top}px`;
  noBtn.style.left = `${left}px`;
});

/* --- Canvas confetti --- */
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let confettiParticles = [];

function createConfetti(){
  confettiParticles = [];
  for(let i=0;i<150;i++){
    confettiParticles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height - canvas.height,
      r: Math.random()*6+4,
      d: Math.random()*150+50,
      color: ['#ff6ba9','#ffd166','#00e5ff','#b388ff','#ff2e63'][Math.floor(Math.random()*5)],
      tilt: Math.random()*10-10,
      tiltAngle:0,
      tiltAngleIncrement: Math.random()*0.07+0.05
    });
  }
}

function updateConfetti(){
  confettiParticles.forEach(p=>{
    p.tiltAngle += p.tiltAngleIncrement;
    p.y += (Math.cos(p.d)+3+p.r/2)/2;
    p.x += Math.sin(p.d);
    p.tilt = Math.sin(p.tiltAngle) * 15;
    if(p.y > canvas.height){
      p.y = -10;
      p.x = Math.random()*canvas.width;
    }
  });
}

function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiParticles.forEach(p=>{
    ctx.beginPath();
    ctx.lineWidth = p.r/2;
    ctx.strokeStyle = p.color;
    ctx.moveTo(p.x + p.tilt + p.r/2, p.y);
    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r/2);
    ctx.stroke();
  });
}

function startConfetti(){
  createConfetti();
  const duration = 3000;
  const start = Date.now();
  function animate(){
    let timePassed = Date.now() - start;
    drawConfetti();
    updateConfetti();
    if(timePassed < duration){
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  animate();
}

/* --- Botón SÍ con confeti y redirección --- */
const siBtn = document.getElementById('siBtn');
const mensaje = document.getElementById('mensaje');

siBtn.addEventListener('click', () => {
  mensaje.innerText = "Mjm 😢";  // mostrar mensaje
  startConfetti();                // lanzar confeti
  setTimeout(() => {
    window.location.href = "sorpresa.html"; // redirigir después de 3 segundos
  }, 3000);
});

/* --- Ajustar canvas al redimensionar --- */
window.addEventListener('resize', ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
