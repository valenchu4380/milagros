<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>💖 Feliz Cumple 💖</title>
<style>
body, html {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Segoe UI', sans-serif;
  overflow-x:hidden;
  scroll-behavior: smooth;
  background: linear-gradient(135deg,#fbc2eb,#a6c1ee);
  animation: bgAnim 10s ease infinite alternate;
  position: relative;
}

/* --- Fondo animado --- */
@keyframes bgAnim {
  0% { background: linear-gradient(135deg,#fbc2eb,#a6c1ee); }
  50% { background: linear-gradient(135deg,#a6c1ee,#fbc2eb); }
  100% { background: linear-gradient(135deg,#fbc2eb,#a6c1ee); }
}

/* --- Corazones flotando --- */
#heartContainer {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:0;
}
.heart {
  position: absolute;
  color: #ff1744;
  font-size: 20px;
  animation: floatUp 5s linear infinite;
  opacity:0.8;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity:1; }
  100% { transform: translateY(-50px) scale(1.5); opacity:0; }
}

/* --- Contenedor principal centrado --- */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 20px;
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content: center; /* centra verticalmente */
  min-height: 80vh; /* ocupa la mayor parte de la altura */
  z-index:1;
  position:relative;
  text-align:center;
}

/* --- Título principal --- */
h1 {
  font-size: 50px;
  color:#fff;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  margin-bottom: 10px;
  opacity:0;
  animation: fadeIn 2s forwards;
}

/* --- Frase introductoria --- */
h2 {
  font-size: 25px;
  color:#fff;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
  margin-bottom: 30px;
  opacity:0;
  animation: fadeIn 2s forwards 1s;
}

/* --- Botón --- */
button {
  padding: 15px 35px;
  font-size: 20px;
  color: white;
  background: #e91e63;
  border: none;
  border-radius: 25px;
  cursor:pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: transform 0.3s, background 0.3s;
  opacity:0;
  animation: fadeIn 2s forwards 2s;
}
button:hover {
  transform: scale(1.1);
  background:#c2185b;
}

/* --- Animación fadeIn --- */
@keyframes fadeIn{
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

/* --- Frases flotantes --- */
.floating-text{
  position: fixed;
  top: 100%;
  color: white;
  font-size: 20px;
  opacity: 0.9;
  text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
  pointer-events: none;
  user-select: none;
  animation: floatText 6s linear forwards;
}
@keyframes floatText {
  0% { transform: translateY(0); opacity:1; }
  80% { transform: translateY(-110vh); opacity:1; }
  100% { transform: translateY(-110vh); opacity:0; }
}

/* --- Burbujas --- */
.bubble {
  position: absolute;
  border-radius:50%;
  background: rgba(255,255,255,0.5);
  pointer-events:none;
  animation: rise 5s linear forwards;
}
@keyframes rise {
  0% { transform: translateY(0) scale(0.5); opacity:0.7; }
  100% { transform: translateY(-100vh) scale(1); opacity:0; }
}

/* --- GIF sorpresa con overlay --- */
#gifOverlay {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.5); /* fondo semi-transparente */
  z-index:998;
  opacity:0;
  transition: opacity 1s ease-in-out;
}
#gifOverlay.show {
  display:block;
  opacity:1;
}
#gifSorpresa {
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  z-index:999;
  opacity:0;
  transition: opacity 1s ease-in-out;
}
#gifSorpresa.show {
  display:block;
  opacity:1;
}
#gifSorpresa img {
  width:400px;
  height:auto;
  border-radius:15px;
}
</style>
</head>
<body>

<div id="heartContainer"></div>

<div class="container">
  <h1>💖 Feliz Cumple! 💖</h1>
  <h2>Te preparé algo especial… 💌</h2>
  <button id="verSorpresaBtn">Ver Sorpresa</button>
</div>

<!-- Overlay para oscurecer fondo -->
<div id="gifOverlay"></div>

<!-- GIF sorpresa -->
<div id="gifSorpresa">
  <img src="C:\Users\Administrator\Desktop\mili\Happy Birthday Flames GIF.gif" alt="Sorpresa">
</div>

<script>
/* --- Corazones flotando --- */
function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=Math.random()*20+15+"px";
  heart.style.animationDuration=(Math.random()*3+3)+"s";
  document.getElementById("heartContainer").appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,500);

/* --- Frases flotantes --- */
const texts = ["Te amo 💖","Eres mi mundo 🌎","Siempre juntos ✨","Mi persona favorita 💕"];
function createFloatingText(){
  const t = document.createElement("div");
  t.classList.add("floating-text");
  t.innerText = texts[Math.floor(Math.random()*texts.length)];
  t.style.left = Math.random() * 80 + "vw";
  t.style.fontSize = Math.random()*15+15 + "px";
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 6000);
}
setInterval(createFloatingText, 1500);

/* --- Burbujas al mover el mouse --- */
document.addEventListener('mousemove', function(e){
  const bubble = document.createElement('div');
  bubble.classList.add('bubble');
  bubble.style.left = e.clientX + 'px';
  bubble.style.top = e.clientY + 'px';
  bubble.style.width = bubble.style.height = Math.random()*20+10+'px';
  document.body.appendChild(bubble);
  setTimeout(()=> bubble.remove(),5000);
});

/* --- Confeti suave --- */
function createConfetti(){
  const confetti = document.createElement('div');
  confetti.classList.add('confetti');
  confetti.style.left = Math.random()*window.innerWidth+'px';
  confetti.style.top = '-10px';
  document.body.appendChild(confetti);
  const speed = Math.random()*2+1;
  let top = -10;
  const interval = setInterval(()=>{
    top += speed;
    confetti.style.top = top+'px';
    if(top>window.innerHeight){
      confetti.remove();
      clearInterval(interval);
    }
  }, 20);
}
setInterval(createConfetti, 300);

/* --- GIF sorpresa con overlay --- */
document.getElementById('verSorpresaBtn').addEventListener('click', function(){
  const gifDiv = document.getElementById('gifSorpresa');
  const overlay = document.getElementById('gifOverlay');
  
  overlay.classList.add('show');
  gifDiv.classList.add('show');

  setTimeout(()=>{
    gifDiv.style.opacity = '0';
    overlay.style.opacity = '0';
    setTimeout(()=> window.location.href = 'pregunta.html', 1000);
  }, 3000);
});
</script>
</body>
</html>
