<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Cumple, Mili 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body, html {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Poppins','Segoe UI',sans-serif;
  overflow-x:hidden;
  scroll-behavior: smooth;
  background: linear-gradient(135deg,#22113a,#3d1a5e);
  animation: bgAnim 12s ease infinite alternate;
  position: relative;
}

/* --- Fondo animado --- */
@keyframes bgAnim {
  0% { background: linear-gradient(135deg,#22113a,#3d1a5e); }
  50% { background: linear-gradient(135deg,#2d1650,#491f80); }
  100% { background: linear-gradient(135deg,#1c1031,#3a1868); }
}

/* --- Cursor en forma de corazon --- */
* {
  cursor: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%23ff6ba9'%20stroke='%23ffffff'%20stroke-width='0.8'%20d='M12%2021.35l-1.45-1.32C5.4%2015.36%202%2012.28%202%208.5%202%205.42%204.42%203%207.5%203c1.74%200%203.41.81%204.5%202.09C13.09%203.81%2014.76%203%2016.5%203%2019.58%203%2022%205.42%2022%208.5c0%203.78-3.4%206.86-8.55%2011.54L12%2021.35z'/%3E%3C/svg%3E") 14 20, auto !important;
}

/* --- Corazones del cursor --- */
.cursor-heart {
  position: fixed;
  z-index: 999;
  color: #ff6ba9;
  pointer-events:none;
  user-select:none;
  animation: heartBurst 1.1s ease-out forwards;
}
@keyframes heartBurst {
  0%   { transform: translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1; }
  55%  { transform: translate(-50%,-170%) scale(1.2) rotate(15deg); opacity:1; }
  100% { transform: translate(-50%,-290%) scale(0.9) rotate(-12deg); opacity:0; }
}

/* --- Contenedor principal centrado --- */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 20px;
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content: center; /* centra verticalmente */
  min-height: 80vh; /* ocupa la mayor parte de la altura */
  z-index:1;
  position:relative;
  text-align:center;
}

/* --- Título principal --- */
h1 {
  font-family:'Great Vibes','Playfair Display',serif;
  font-size: 58px;
  color:#fff;
  text-shadow: 0 0 25px rgba(255,107,169,0.45), 2px 2px 10px rgba(0,0,0,0.4);
  margin-bottom: 10px;
  opacity:0;
  animation: fadeIn 2s forwards;
}

/* --- Frase introductoria --- */
h2 {
  font-size: 25px;
  color:#f8e9f4;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.4);
  margin-bottom: 30px;
  opacity:0;
  animation: fadeIn 2s forwards 1s;
}

/* --- Botón --- */
button {
  padding: 15px 35px;
  font-size: 20px;
  color: white;
  background: linear-gradient(135deg,#ff6ba9,#ff2e78);
  border: none;
  border-radius: 25px;
  cursor:pointer;
  box-shadow: 0 5px 18px rgba(255,107,169,0.4);
  transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
  opacity:0;
  animation: fadeIn 2s forwards 2s;
}
button:hover {
  transform: scale(1.08);
  background:#e5508f;
  box-shadow: 0 8px 25px rgba(255,107,169,0.55);
}

/* --- Animación fadeIn --- */
@keyframes fadeIn{
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

/* --- Rosa que florece --- */
#roseScene {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition: opacity 0.8s ease;
}
#roseScene.show { opacity:1; visibility:visible; }
.rose-wrap {
  position:relative;
  width:420px; height:430px;
  transform-origin: bottom center;
  animation: roseSway 6s ease-in-out infinite;
}
@keyframes roseSway {
  0%,100% { transform: rotateZ(-1.1deg); }
  50%     { transform: rotateZ(1.1deg); }
}
.rose {
  position:absolute;
  top:0; left:50%;
  width:400px; height:400px;
  transform:translateX(-50%);
  overflow:visible;
  filter: drop-shadow(0 0 24px rgba(255,107,169,0.35));
  animation: roseGlow 3.2s ease-in-out infinite alternate;
}
@keyframes roseGlow {
  from { filter: drop-shadow(0 0 18px rgba(255,107,169,0.3)); }
  to   { filter: drop-shadow(0 0 40px rgba(255,107,169,0.6)); }
}
.petal {
  opacity:0;
}
.petal.in { animation: petIn .7s ease both; }
@keyframes petIn {
  from { opacity:0; }
  to   { opacity:1; }
}
.rose-center {
  opacity:0;
  transform-box: fill-box;
  transform-origin: center;
}
.rose-center.in { animation: centerIn .45s ease both; }
@keyframes centerIn {
  from { opacity:0; transform: scale(0); }
  to   { opacity:1; transform: scale(1); }
}
.stem {
  position:absolute;
  top:200px; left:50%;
  width:7px; height:170px;
  transform: translateX(-50%);
  transform-origin: top;
  background: linear-gradient(#2fb38b,#1b6d55);
  border-radius:4px;
  opacity:0;
}
.stem.in { animation: growY .6s ease both; }
@keyframes growY {
  from { transform: translateX(-50%) scaleY(0); opacity:0; }
  to   { transform: translateX(-50%) scaleY(1); opacity:1; }
}
.leaf {
  position:absolute;
  width:60px; height:26px;
  background: linear-gradient(135deg,#3aa17a,#17604c);
  border-radius: 0 100% 100% 0 / 0 100% 100% 0;
  opacity:0;
}
.leaf.l1 { top:260px; left:calc(50% - 4px); transform-origin: right center; transform: rotate(-40deg); }
.leaf.l2 { top:270px; left:calc(50% - 4px); transform-origin: right center; transform: rotate(40deg); }
.leaf.in { animation: leafIn .5s ease forwards; }
@keyframes leafIn {
  from { opacity:0; }
  to   { opacity:1; }
}

/* --- Confeti --- */
.confetti {
  position: absolute;
  top: -20px;
  width: 8px;
  height: 14px;
  border-radius: 2px;
  pointer-events:none;
}

/* --- Estrellas --- */
.star {
  position: fixed;
  width: 3px;
  height: 3px;
  background:#fff;
  border-radius:50%;
  pointer-events:none;
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity:0.15; transform: scale(0.8); }
  50% { opacity:0.9; transform: scale(1.2); }
}

/* --- Overlay oscuro para la rosa --- */
#darkOverlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.55);
  z-index:998;
  opacity:0;
  visibility:hidden;
  transition: opacity 0.8s ease;
}
#darkOverlay.show {
  opacity:1;
  visibility:visible;
}

/* --- Destellos alrededor de la rosa --- */
.sparkle {
  position: absolute;
  width:6px; height:6px;
  border-radius:50%;
  background: radial-gradient(circle, #ffd166 0%, rgba(255,209,102,0) 70%);
  pointer-events:none;
  animation: sparkleIn 2.4s ease-in-out infinite;
}
@keyframes sparkleIn {
  0%,100% { opacity:0; transform: scale(0.5); }
  50%     { opacity:1; transform: scale(1.15); }
}

/* --- Interacción con la rosa --- */
#roseScene.show { pointer-events:auto; }
.rose.burst { animation: rosePulse .5s ease; }
@keyframes rosePulse {
  0%   { transform: translateX(-50%) scale(1); }
  40%  { transform: translateX(-50%) scale(1.07); }
  100% { transform: translateX(-50%) scale(1); }
}
.heart-burst {
  position: fixed;
  color:#ff8ab8;
  pointer-events:none;
  user-select:none;
  animation: heartPop 1s ease-out forwards;
}
@keyframes heartPop {
  0%   { transform: translate(-50%,-50%) scale(0.4) rotate(0deg); opacity:1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity:0; }
}
#roseMsg {
  position:absolute;
  bottom:30px;
  left:0;
  width:100%;
  text-align:center;
  color:#ffe0ef;
  font-family:'Great Vibes','Playfair Display',serif;
  font-size:34px;
  text-shadow: 0 0 18px rgba(255,107,169,0.5), 1px 1px 6px rgba(0,0,0,0.5);
  opacity:0;
  pointer-events:none;
}
#roseMsg.in { animation: fadeIn 2s forwards; }

/* --- Responsive --- */
@media (max-width: 600px) {
  h1 { font-size: 36px; }
  h2 { font-size: 18px; }
  button { padding: 14px 28px; font-size: 17px; }
}
</style>
</head>
<body>

<div class="container">
  <h1>💖 Feliz Cumple, Mili! 💖</h1>
  <h2>Te preparé algo especial… 💌</h2>
  <button id="verSorpresaBtn">Ver Sorpresa</button>
</div>

<!-- Overlay para oscurecer fondo -->
<div id="darkOverlay"></div>

<!-- Rosa petalo a petalo -->
<div id="roseScene">
  <div class="rose-wrap">
    <svg id="rose" class="rose" viewBox="0 0 400 400"></svg>
    <div id="stem" class="stem"></div>
    <div id="leaf1" class="leaf l1"></div>
    <div id="leaf2" class="leaf l2"></div>
  </div>
  <div id="roseMsg">Para la más linda de todas las noches 💕</div>
</div>

<script>
/* --- Estrellas --- */
function createStars(){
  for(let i=0;i<70;i++){
    const s=document.createElement("div");
    s.classList.add("star");
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDuration=(Math.random()*3+2)+"s";
    s.style.animationDelay=(Math.random()*3)+"s";
    document.body.appendChild(s);
  }
}
createStars();

/* --- Corazones al mover el mouse --- */
let lastHeart = 0;
document.addEventListener('mousemove', function(e){
  const now = Date.now();
  if(now - lastHeart < 60) return;
  lastHeart = now;
  const heart = document.createElement('div');
  heart.classList.add('cursor-heart');
  heart.innerHTML = '❤';
  heart.style.left = e.clientX + 'px';
  heart.style.top = e.clientY + 'px';
  heart.style.fontSize = Math.random()*14+12 + 'px';
  document.body.appendChild(heart);
  setTimeout(()=> heart.remove(), 1100);
});

/* --- Confeti suave --- */
const confettiColors = ['#ff6ba9','#ffd166','#00e5ff','#b388ff','#ff2e63'];
function createConfetti(){
  const confetti = document.createElement('div');
  confetti.classList.add('confetti');
  confetti.style.left = Math.random()*window.innerWidth+'px';
  confetti.style.top = '-10px';
  confetti.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
  confetti.style.transform = 'rotate('+Math.random()*360+'deg)';
  document.body.appendChild(confetti);
  const speed = Math.random()*2+1;
  let top = -10;
  const interval = setInterval(()=>{
    top += speed;
    confetti.style.top = top+'px';
    if(top>window.innerHeight){
      confetti.remove();
      clearInterval(interval);
    }
  }, 20);
}
setInterval(createConfetti, 300);

/* --- Rosa que florece en capas --- */
function buildRose(){
  const rose = document.getElementById('rose');
  const layers = [
    { n:14, r:98, s:1.0,  w:1.0,  l:38, sat:62 },
    { n:14, r:70, s:0.85, w:0.95, l:46, sat:68 },
    { n:12, r:46, s:0.8,  w:0.9,  l:54, sat:72 },
    { n:10, r:27, s:0.75, w:0.85, l:62, sat:74 },
    { n:8,  r:12, s:0.68, w:0.8,  l:70, sat:72 }
  ];
  let inner = '';
  let delay = 0;
  let layerIndex = 0;
  for(const layer of layers){
    const step = 360/layer.n;
    const off = layerIndex*13;
    for(let j=0;j<layer.n;j++){
      const ang = off + j*step;
      const w = layer.w;
      const l = layer.l - (j%3)*2;
      const fill = 'hsl(345, ' + layer.sat + '%, ' + l + '%)';
      const d = 'M0 0 C ' + (24*w) + ' -' + (26*w) + ', ' + (66*w) + ' -' + (28*w) + ', 88 0 C ' + (66*w) + ' ' + (28*w) + ', ' + (24*w) + ' ' + (30*w) + ', 0 0 Z';
      inner += '<path class="petal in" d="' + d + '" transform="translate(200,200) rotate(' + ang + ') translate(' + layer.r + ',0) scale(' + layer.s + ')" fill="' + fill + '" stroke="rgba(0,0,0,0.15)" stroke-width="0.6" style="animation-delay:' + delay + 'ms"></path>';
    }
    delay += 400;
    layerIndex++;
  }
  rose.innerHTML = inner +
    '<circle class="rose-center in" cx="200" cy="200" r="10" fill="#ffd166" style="animation-delay:' + (delay+120) + 'ms"></circle>' +
    '<circle class="rose-center in" cx="200" cy="200" r="4" fill="#fff2c0" style="animation-delay:' + (delay+200) + 'ms"></circle>';
  const stem = document.getElementById('stem');
  const leaf1 = document.getElementById('leaf1');
  const leaf2 = document.getElementById('leaf2');
  stem.classList.remove('in');
  leaf1.classList.remove('in');
  leaf2.classList.remove('in');
  stem.style.animationDelay = '';
  leaf1.style.animationDelay = '';
  leaf2.style.animationDelay = '';
  stem.classList.add('in');
  stem.style.animationDelay = '1700ms';
  leaf1.classList.add('in');
  leaf1.style.animationDelay = '1900ms';
  leaf2.classList.add('in');
  leaf2.style.animationDelay = '1900ms';
}

/* --- Rosa sorpresa --- */
document.getElementById('verSorpresaBtn').addEventListener('click', function(){
  const overlay = document.getElementById('darkOverlay');
  const roseScene = document.getElementById('roseScene');

  overlay.classList.add('show');
  roseScene.classList.add('show');
  buildRose();
  createSparkles();

  setTimeout(()=>{
    document.getElementById('roseMsg').classList.add('in');
  }, 2400);

  setTimeout(()=>{
    roseScene.classList.remove('show');
    overlay.classList.remove('show');
    setTimeout(()=> window.location.href = 'pregunta.html', 900);
  }, 4300);
});

/* --- Clic en la escena: la rosa late y estallan corazones --- */
function burstHearts(x, y){
  for(let i=0;i<8;i++){
    const h = document.createElement('div');
    h.classList.add('heart-burst');
    h.innerHTML = '❤';
    h.style.left = x + 'px';
    h.style.top  = y + 'px';
    h.style.fontSize = (Math.random()*16 + 14) + 'px';
    const ang  = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*50;
    h.style.setProperty('--dx', Math.round(Math.cos(ang)*dist) + 'px');
    h.style.setProperty('--dy', Math.round(Math.sin(ang)*dist) + 'px');
    h.style.setProperty('--rot', (Math.random()*80 - 40) + 'deg');
    document.body.appendChild(h);
    setTimeout(()=> h.remove(), 1050);
  }
}
document.getElementById('roseScene').addEventListener('click', function(e){
  const rose = document.querySelector('.rose');
  rose.classList.remove('burst');
  void rose.offsetWidth;
  rose.classList.add('burst');
  burstHearts(e.clientX, e.clientY);
});

/* --- Destellos alrededor de la rosa --- */
function createSparkles(){
  const scene = document.getElementById('roseScene');
  for(let i=0;i<12;i++){
    const sp = document.createElement('div');
    sp.classList.add('sparkle');
    const ang = Math.random()*Math.PI*2;
    const dist = Math.random()*170 + 90;
    sp.style.left = 'calc(50% + ' + Math.round(Math.cos(ang)*dist) + 'px)';
    sp.style.top  = 'calc(50% + ' + Math.round(Math.sin(ang)*dist) + 'px)';
    sp.style.animationDelay    = (Math.random()*2) + 's';
    sp.style.animationDuration = (Math.random()*1.6 + 1.8) + 's';
    scene.appendChild(sp);
  }
}
</script>
</body>
</html>
