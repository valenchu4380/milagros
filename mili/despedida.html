<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felicidades 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body, html {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Poppins','Segoe UI',sans-serif;
  overflow-x:hidden;
  background: linear-gradient(135deg,#22113a,#3d1a5e);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* --- Cursor en forma de corazon --- */
* {
  cursor: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2024%2024'%3E%3Cpath%20fill='%23ff6ba9'%20stroke='%23ffffff'%20stroke-width='0.8'%20d='M12%2021.35l-1.45-1.32C5.4%2015.36%202%2012.28%202%208.5%202%205.42%204.42%203%207.5%203c1.74%200%203.41.81%204.5%202.09C13.09%203.81%2014.76%203%2016.5%203%2019.58%203%2022%205.42%2022%208.5c0%203.78-3.4%206.86-8.55%2011.54L12%2021.35z'/%3E%3C/svg%3E") 14 20, auto !important;
}

/* --- Corazones del cursor --- */
.cursor-heart {
  position: fixed;
  z-index: 999;
  color: #ff6ba9;
  pointer-events:none;
  user-select:none;
  animation: heartBurst 1.1s ease-out forwards;
}
@keyframes heartBurst {
  0%   { transform: translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1; }
  55%  { transform: translate(-50%,-170%) scale(1.2) rotate(15deg); opacity:1; }
  100% { transform: translate(-50%,-290%) scale(0.9) rotate(-12deg); opacity:0; }
}

/* Contenedor principal */
.container {
  display:flex;
  max-width:1000px;
  width:90%;
  border-radius: 20px;
  padding:20px;
  align-items:center;
  gap: 20px;
}

/* Texto */
.text {
  flex:1;
  color:white;
}
.text h1 {
  font-family:'Great Vibes','Playfair Display',serif;
  font-size: 56px;
  margin-bottom: 20px;
  color:#fff;
  text-shadow: 0 0 25px rgba(255,107,169,0.5), 2px 2px 10px rgba(0,0,0,0.4);
}
.text p {
  font-size: 22px;
  line-height:1.5;
  color:#f3e9f8;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.4);
}

/* Imagen */
.image {
  flex:1;
  display:flex;
  justify-content:center;
}
.image img {
  width: 400px;
  height: auto;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,107,169,0.25);
}

/* Estrellas */
.star {
  position: fixed;
  width: 3px;
  height: 3px;
  background:#fff;
  border-radius:50%;
  pointer-events:none;
  animation: twinkle 3s ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity:0.15; transform: scale(0.8); }
  50% { opacity:0.9; transform: scale(1.2); }
}

/* Responsive */
@media (max-width: 700px) {
  .container { flex-direction: column; text-align:center; }
  .text h1 { font-size: 36px; }
  .text p { font-size: 18px; }
  .image img { width: 100%; max-width: 320px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="text">
    <h1>¡Feliz Cumpleaños! 🎉</h1>
    <p>Espero que tu día esté lleno de alegría, amor y momentos inolvidables. 💖<br>
    Te deseo un año increíble y que todos tus sueños se hagan realidad.</p>
  </div>
  <div class="image">
    <img src="fotos/b28dbfb8-afec-49c9-be6f-7499d8666f3b.jfif" alt="Foto de ella">
  </div>
</div>

<script>
/* --- Corazones al mover el mouse --- */
let lastHeart = 0;
document.addEventListener('mousemove', function(e){
  const now = Date.now();
  if(now - lastHeart < 60) return;
  lastHeart = now;
  const heart = document.createElement('div');
  heart.classList.add('cursor-heart');
  heart.innerHTML = '❤';
  heart.style.left = e.clientX + 'px';
  heart.style.top = e.clientY + 'px';
  heart.style.fontSize = Math.random()*14+12 + 'px';
  document.body.appendChild(heart);
  setTimeout(()=> heart.remove(), 1100);
});

/* --- Estrellas --- */
function createStars(){
  for(let i=0;i<70;i++){
    const s=document.createElement("div");
    s.classList.add("star");
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDuration=(Math.random()*3+2)+"s";
    s.style.animationDelay=(Math.random()*3)+"s";
    document.body.appendChild(s);
  }
}
createStars();
</script>

</body>
</html>
