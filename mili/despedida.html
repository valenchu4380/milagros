<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎉 Felicidades 💖</title>
<style>
body, html {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Segoe UI', sans-serif;
  overflow-x:hidden;
  background: linear-gradient(135deg,#fbc2eb,#a6c1ee);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Contenedor principal */
.container {
  display:flex;
  max-width:1000px;
  width:90%;
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
  padding:20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  align-items:center;
  gap: 20px;
}

/* Texto */
.text {
  flex:1;
  color:white;
}
.text h1 {
  font-size: 50px;
  margin-bottom: 20px;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.4);
}
.text p {
  font-size: 22px;
  line-height:1.5;
  text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
}

/* Imagen */
.image {
  flex:1;
  display:flex;
  justify-content:center;
}
.image img {
  width: 400px;
  height: auto;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Corazones flotando */
#heartContainer {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:0;
}
.heart {
  position: absolute;
  color: #ff1744;
  font-size: 20px;
  animation: floatUp 5s linear infinite;
  opacity:0.8;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity:1; }
  100% { transform: translateY(-50px) scale(1.5); opacity:0; }
}
</style>
</head>
<body>

<div id="heartContainer"></div>

<div class="container">
  <div class="text">
    <h1>¡Feliz Cumpleaños! 🎉</h1>
    <p>Espero que tu día esté lleno de alegría, amor y momentos inolvidables. 💖<br>
    Te deseo un año increíble y que todos tus sueños se hagan realidad.</p>
  </div>
  <div class="image">
    <img src="C:\Users\Administrator\Desktop\mili\fotos\b28dbfb8-afec-49c9-be6f-7499d8666f3b.jfif" alt="Foto de ella">
  </div>
</div>

<script>
/* Corazones flotando */
function createHeart(){
  const heart=document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=Math.random()*20+15+"px";
  heart.style.animationDuration=(Math.random()*3+3)+"s";
  document.getElementById("heartContainer").appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart,500);
</script>

</body>
</html>
